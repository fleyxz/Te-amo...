* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background-color: var(--ink);
  background-image:
    radial-gradient(70% 40% at 8% 0%, rgba(247, 203, 216, 0.24), transparent 70%),
    radial-gradient(80% 45% at 100% 100%, rgba(238, 166, 189, 0.2), transparent 70%);
  color: var(--mist);
  font-family: var(--body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--blush); outline-offset: 3px; }

.screen {
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);
}

/* Menú */
#menu { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.hero { position: relative; padding: 36px 0 28px; min-height: 250px; flex: none; }
.hero h1 {
  position: relative;
  max-width: 9.5em;
  font-family: var(--title);
  font-weight: 300;
  font-size: clamp(40px, 12.5vw, 60px);
  line-height: 1.04;
  letter-spacing: -0.01em;
  text-wrap: balance;
  color: var(--blush);
}
.flor-menu {
  position: absolute;
  top: -6px;
  right: -64px;
  width: 78%;
  max-width: 400px;
  aspect-ratio: 1;
  background-color: var(--blush);
  -webkit-mask: var(--flor) center / contain no-repeat;
  mask: var(--flor) center / contain no-repeat;
  opacity: 0.38;
  pointer-events: none;
}

.cats { position: relative; list-style: none; display: flex; flex-direction: column; gap: 10px; flex: none; }
.cat {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  padding: 16px 18px;
  border: 1px solid rgba(247, 203, 216, 0.35);
  border-radius: 18px;
  background: rgba(27, 20, 24, 0.7);
  transition: background 0.2s, border-color 0.2s, transform 0.15s;
}
.cat:active { transform: scale(0.98); }
.cat .name { font-family: var(--display); font-style: italic; font-size: 22px; line-height: 1.1; }
.cat .sub { display: block; margin-top: 4px; font-size: 13px; color: rgba(251, 230, 236, 0.62); }
.cat .meta { margin-left: auto; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; color: rgba(251, 230, 236, 0.7); white-space: nowrap; }
.chip {
  display: inline-block;
  margin-right: 8px;
  padding: 2px 7px;
  border: 1px solid var(--blush);
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--blush);

const $ = (s) => document.querySelector(s);
const menu = $('#menu'), game = $('#game'), stage = $('#stage');
let deck = [], i = 0, label = '', screen = 'menu', busy = false, swiped = 0;

function shuffle(a) {
  for (let k = a.length - 1; k > 0; k--) {
    const j = Math.floor(Math.random() * (k + 1));
    [a[k], a[j]] = [a[j], a[k]];
  }
  return a;
}

function show(name) {
  screen = name;
  menu.hidden = name !== 'menu';
  game.hidden = name !== 'game';
}

function buildMenu() {
  const ul = $('#cats');
  ul.innerHTML = '';
  const rows = CATS.map((c) => ({ label: c.nombre, sub: c.sub, adult: c.adulto, n: c.items.length, pick: () => c.items.map((t) => ({ cat: c.nombre, nota: c.nota || '', text: t })) })).sort((a, b) => Number(a.adult) - Number(b.adult));
  rows.forEach((r) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cat';
    const left = document.createElement('span');
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = r.label;
    const sub = document.createElement('span');
    sub.className = 'sub';
    sub.textContent = r.sub;
    left.append(name, sub);
    const meta = document.createElement('span');
    meta.className = 'meta';
    if (r.adult) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = '+18';
      meta.append(chip);
    }
    meta.append(document.createTextNode(r.n + ' preguntas'));
    b.append(left, meta);
    b.addEventListener('click', () => start(r.pick(), r.label));
    li.append(b);
    ul.append(li);
  });
}

function start(items, name) {
  deck = shuffle(items.slice());
  i = 0;
  label = name;
  show('game');
  render('settle');
}

function makeCard(item, pos, n, total) {
  const c = document.createElement('article');
  c.className = 'card';
  c.dataset.pos = pos;
  const flor = document.createElement('div');
  flor.className = 'flor-card';
  flor.setAttribute('aria-hidden', 'true');
  c.append(flor);
  const inn = document.createElement('div');
  inn.className = 'card-in';
  const top = document.createElement('div');
  top.className = 'card-top';
  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = item.cat;
  const num = document.createElement('span');
  num.className = 'num';
  num.textContent = n + ' / ' + total;
  top.append(tag, num);
  const q = document.createElement('p');
  q.className = 'q';
  q.textContent = item.text;
  inn.append(top, q);
  if (item.nota) {
    const note = document.createElement('p');
    note.className = 'note';
    note.textContent = item.nota;
    inn.append(note);
  }
  c.append(inn);
  return c;
}

function makeEnd() {
  const c = document.createElement('article');
  c.className = 'card';
  c.dataset.pos = 0;
  c.innerHTML = '<div class="flor-card" aria-hidden="true"></div><div class="card-in"><div class="card-top"><span class="tag"></span><span class="num"></span></div><div class="end-body"><h2>Ya pasaron todas</h2><p></p><button class="btn solid" type="button" id="again">Barajar de nuevo</button><button class="btn" type="button" id="other">Elegir otra categoría</button></div></div>';
  c.querySelector('.tag').textContent = label;
  c.querySelector('.num').textContent = deck.length + ' / ' + deck.length;
  c.querySelector('p').textContent = 'Vieron las ' + deck.length + ' preguntas de esta baraja.';
  c.querySelector('#again').addEventListener('click', () => { shuffle(deck); i = 0; render('settle'); });
  c.querySelector('#other').addEventListener('click', () => show('menu'));
  return c;
}

function render(anim) {
  busy = false;
  stage.className = 'stage' + (anim ? ' ' + anim : '');
  stage.innerHTML = '';
  const total = deck.length;
  const ended = i >= total;
  if (ended) {
    stage.append(makeEnd());
  } else {
    for (let p = Math.min(2, total - 1 - i); p >= 0; p--) {
      const card = makeCard(deck[i + p], p, i + p + 1, total);
      stage.append(card);
      if (p === 0) bindDrag(card);
    }
  }
  $('#count').textContent = label + ' · ' + Math.min(i + 1, total) + ' de ' + total;
  $('#fill').style.width = (Math.min(i, total) / total * 100) + '%';
  $('#prev').disabled = i === 0;
  $('#next').disabled = ended;
}

function fling(dir) {
  if (busy || i >= deck.length) return;
  busy = true;
  const card = stage.querySelector('.card[data-pos="0"]');
  card.style.transition = 'transform 0.32s ease-in, opacity 0.32s';
  card.style.transform = 'translate(' + (dir * window.innerWidth * 1.1) + 'px, 30px) rotate(' + (dir * 22) + 'deg)';
  card.style.opacity = '0';
  swiped++;
  if (swiped >= 1) $('#hint').classList.add('off');
  setTimeout(() => { i++; render('settle'); }, 280);
}

function goPrev() {
  if (busy || i === 0) return;
  i--;
  render('enter-left');
}

function bindDrag(card) {
  let sx = 0, sy = 0, dx = 0, dragging = false;
  card.addEventListener('pointerdown', (e) => {
    if (busy) return;
    dragging = true;
    sx = e.clientX;
    sy = e.clientY;
    dx = 0;
    card.setPointerCapture(e.pointerId);
    card.style.transition = 'none';
  });
  card.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    dx = e.clientX - sx;
    const dy = e.clientY - sy;
    card.style.transform = 'translate(' + dx + 'px, ' + (dy * 0.25) + 'px) rotate(' + (dx / 16) + 'deg)';
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    card.style.transition = '';
    if (Math.abs(dx) > 90) fling(dx > 0 ? 1 : -1);
    else card.style.transform = '';
    dx = 0;
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

$('#next').addEventListener('click', () => fling(1));
$('#prev').addEventListener('click', goPrev);
$('#back').addEventListener('click', () => show('menu'));
document.addEventListener('keydown', (e) => {
  if (screen !== 'game') return;
  if (e.key === 'ArrowRight') fling(1);
  if (e.key === 'ArrowLeft') goPrev();
});

buildMenu();
show('menu');
</script>
